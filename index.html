<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>CIPHER_TERMINAL</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
  :root{
    --g:#00ff66; --g2:#00b34a; --g3:#066b30; --bg:#000; --panel:#031009; --warn:#ffb000; --err:#ff4d4d;
    --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
    --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--g);
    font-family:"SF Mono",ui-monospace,Menlo,Consolas,"Courier New",monospace;
    -webkit-text-size-adjust:100%;overscroll-behavior:none}
  body::before{ /* scanlines */
    content:"";position:fixed;inset:0;pointer-events:none;z-index:50;
    background:repeating-linear-gradient(to bottom,rgba(0,255,102,.045) 0,rgba(0,255,102,.045) 1px,transparent 1px,transparent 3px);
  }
  body::after{ /* vignette */
    content:"";position:fixed;inset:0;pointer-events:none;z-index:49;
    background:radial-gradient(ellipse at center,transparent 60%,rgba(0,0,0,.55) 100%);
  }
  .app{display:flex;flex-direction:column;height:100%;
    padding:var(--sat) var(--sar) 0 var(--sal)}
  header{padding:12px 16px 8px;border-bottom:1px solid var(--g3)}
  h1{margin:0;font-size:15px;letter-spacing:.12em;font-weight:700;text-shadow:0 0 8px var(--g)}
  .sub{font-size:11px;color:var(--g2);margin-top:3px}
  .cursor{display:inline-block;width:8px;height:14px;background:var(--g);vertical-align:-2px;margin-left:3px;animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}

  main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px 20px}
  .tab{display:none;animation:fade .25s ease}
  .tab.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

  label{display:block;font-size:12px;color:var(--g2);margin:14px 0 6px;letter-spacing:.06em}
  label:first-child{margin-top:0}
  label::before{content:"> "}
  textarea{
    width:100%;min-height:120px;resize:vertical;background:var(--panel);color:var(--g);
    border:1px solid var(--g3);border-radius:6px;padding:12px;font:inherit;font-size:16px;line-height:1.5;
    outline:none;caret-color:var(--g);-webkit-appearance:none;appearance:none
  }
  textarea:focus{border-color:var(--g);box-shadow:0 0 10px rgba(0,255,102,.35)}
  textarea::placeholder{color:#0a7a38}
  .out{min-height:100px;word-break:break-all}
  .btn{
    display:block;width:100%;margin-top:12px;padding:14px;font:inherit;font-size:15px;font-weight:700;letter-spacing:.08em;
    color:#000;background:var(--g);border:1px solid var(--g);border-radius:6px;cursor:pointer;
    box-shadow:0 0 12px rgba(0,255,102,.5);text-transform:uppercase;-webkit-appearance:none;appearance:none;text-align:center
  }
  .btn:active{transform:scale(.98);background:var(--g2)}
  .btn.ghost{background:transparent;color:var(--g);box-shadow:none}
  .btn:disabled{opacity:.4}
  .row{display:flex;gap:10px}
  .row .btn{flex:1}
  .msg{font-size:12px;margin-top:8px;min-height:16px;color:var(--warn)}
  .msg.ok{color:var(--g)} .msg.err{color:var(--err)}

  /* tab bar */
  nav{display:flex;border-top:1px solid var(--g3);background:#010805;
    padding:0 var(--sar) var(--sab) var(--sal);position:relative;z-index:60}
  nav button{
    flex:1;background:none;border:none;color:var(--g2);font:inherit;font-size:11px;padding:10px 2px 9px;
    letter-spacing:.05em;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;
    border-top:2px solid transparent;margin-top:-1px
  }
  nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  nav button.active{color:var(--g);border-top-color:var(--g);text-shadow:0 0 8px var(--g);background:linear-gradient(to bottom,rgba(0,255,102,.1),transparent)}

  /* ocr */
  #fileInput{display:none}
  .preview{margin-top:12px;display:none;border:1px solid var(--g3);border-radius:6px;overflow:hidden;background:#000}
  .preview img{display:block;width:100%;max-height:260px;object-fit:contain;filter:grayscale(1) contrast(1.1) brightness(.9) sepia(1) hue-rotate(80deg) saturate(3)}
  .bar{height:6px;background:var(--g3);border-radius:3px;margin-top:10px;overflow:hidden;display:none}
  .bar i{display:block;height:100%;width:0;background:var(--g);box-shadow:0 0 8px var(--g);transition:width .2s}

  details{margin-top:18px;border:1px solid var(--g3);border-radius:6px;background:var(--panel)}
  summary{padding:12px;font-size:13px;cursor:pointer;list-style:none;letter-spacing:.05em}
  summary::before{content:"[+] "} details[open] summary::before{content:"[-] "}
  summary::-webkit-details-marker{display:none}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px;padding:0 12px 12px;font-size:12px}
  .grid div{border:1px solid var(--g3);border-radius:4px;padding:4px 6px;display:flex;justify-content:space-between}
  .grid b{color:#fff;font-weight:600}
  .hint{font-size:11px;color:var(--g2);line-height:1.5;margin:10px 0 0}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>CIPHER_TERMINAL//v2.0<span class="cursor"></span></h1>
    <div class="sub" id="status">алфавит загружен: <span id="cnt">0</span> символов</div>
  </header>

  <main>
    <!-- TAB 1 -->
    <section class="tab active" id="tab1">
      <label for="plain">ВВОД ТЕКСТА</label>
      <textarea id="plain" placeholder="Привет, Hello 123!" autocapitalize="off" autocorrect="off" spellcheck="false"></textarea>
      <button class="btn" id="btnEnc">Перевести в код</button>
      <label>ШИФРОТЕКСТ</label>
      <textarea id="encOut" class="out" readonly placeholder="здесь будет код..."></textarea>
      <div class="msg" id="encMsg"></div>
      <button class="btn ghost" id="btnCopy">Скопировать</button>

      <details>
        <summary>ТАБЛИЦА АЛФАВИТА</summary>
        <div class="grid" id="table"></div>
      </details>
    </section>

    <!-- TAB 2 -->
    <section class="tab" id="tab2">
      <label for="cipher">ВВОД ШИФРОТЕКСТА</label>
      <textarea id="cipher" placeholder="Вставьте код..." autocapitalize="characters" autocorrect="off" spellcheck="false"></textarea>
      <button class="btn" id="btnDec">Перевести в текст</button>
      <label>РЕЗУЛЬТАТ</label>
      <textarea id="decOut" class="out" readonly placeholder="здесь будет текст..."></textarea>
      <div class="msg" id="decMsg"></div>
    </section>

    <!-- TAB 3 -->
    <section class="tab" id="tab3">
      <input type="file" id="fileInput" accept="image/*" capture="environment">
      <button class="btn" id="btnPhoto">Сделать фото</button>
      <div class="preview" id="preview"><img id="prevImg" alt=""></div>
      <div class="bar" id="bar"><i id="barI"></i></div>
      <div class="msg" id="ocrMsg"></div>
      <label for="ocrOut">РАСПОЗНАННЫЙ КОД (можно править)</label>
      <textarea id="ocrOut" placeholder="код после сканирования..." autocapitalize="characters" autocorrect="off" spellcheck="false"></textarea>
      <button class="btn" id="btnOcrDec">Расшифровать</button>
      <label>РЕЗУЛЬТАТ</label>
      <textarea id="ocrText" class="out" readonly placeholder="здесь будет текст..."></textarea>
      <div class="msg" id="ocrDecMsg"></div>
      <p class="hint">Код состоит из тройок латинских букв A K M T X Z — их Tesseract читает надёжно. Снимайте крупно, при ярком свете, строки ровно.</p>
    </section>
  </main>

  <nav>
    <button class="active" data-tab="tab1">
      <svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>Зашифровать</button>
    <button data-tab="tab2">
      <svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 7.5-2"/></svg>Расшифровать</button>
    <button data-tab="tab3">
      <svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Сканер</button>
  </nav>
</div>

<script>
(function(){
  'use strict';

  /* ================= АЛФАВИТ ================= */
  // Код — тройки из 6 ASCII-букв (устойчиво к OCR). 6^3 = 216 комбинаций.
  const CODE_CHARS = 'AKMTXZ';
  const TOKEN_LEN = 3;

  const RU_L = 'абвгдеёжзийклмнопрстуфхцчшщъыьэюя';       // 33 буквы (включая ё)
  const RU_U = RU_L.toUpperCase();
  const EN_L = 'abcdefghijklmnopqrstuvwxyz';
  const EN_U = EN_L.toUpperCase();
  const DIGITS = '0123456789';
  const PUNCT = '.,!?;:-()"\'';
  const SPECIAL = [' ', '\n'];

  const symbols = [].concat(
    RU_L.split(''), RU_U.split(''), EN_L.split(''), EN_U.split(''),
    DIGITS.split(''), PUNCT.split(''), SPECIAL
  );

  // Детерминированный PRNG (фиксированное зерно => алфавит всегда одинаковый)
  function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
    t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
  const rnd = mulberry32(0xC1F3A7);

  // Все возможные тройки
  const pool = [];
  (function gen(prefix){
    if(prefix.length===TOKEN_LEN){pool.push(prefix);return}
    for(const c of CODE_CHARS) gen(prefix+c);
  })('');
  // Исключаем тройки из одной повторяющейся буквы (AAA и т.п.) — плохо читаются OCR
  const usable = pool.filter(t => !(t[0]===t[1] && t[1]===t[2]));
  // Fisher–Yates
  for(let i=usable.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[usable[i],usable[j]]=[usable[j],usable[i]]}

  const ENC = {};   // обычный символ -> код
  const DEC = {};   // код -> обычный символ
  symbols.forEach((s,i)=>{ENC[s]=usable[i];DEC[usable[i]]=s});

  if(Object.keys(DEC).length!==symbols.length) throw new Error('Коллизия алфавита');

  // Нормализация необычных символов ввода
  const NORM = {'«':'"','»':'"','“':'"','”':'"','„':'"','‘':"'",'’':"'",'—':'-','–':'-','−':'-','\r':'','\t':' ','\u00A0':' '};

  function encrypt(text){
    const out = []; let skipped = new Set();
    text = text.normalize('NFC');
    for(const ch of text){
      let c = ch;
      if(c==='…'){ ['.','.','.'].forEach(d=>out.push(ENC[d])); continue }
      if(Object.prototype.hasOwnProperty.call(NORM,c)) c = NORM[c];
      if(c==='') continue;
      if(Object.prototype.hasOwnProperty.call(ENC,c)) out.push(ENC[c]);
      else skipped.add(ch);
    }
    return {code: out.join(' '), skipped:[...skipped]};
  }

  // Типичные ошибки OCR -> ближайшие символы алфавита
  const OCR_FIX = {'4':'A','H':'M','N':'M','I':'T','1':'T','l':'T','|':'T','7':'T','2':'Z','S':'Z','5':'Z','Y':'T','V':'K','R':'K','W':'M','0':'X','O':'X','8':'X'};

  function cleanCode(raw, fixOcr){
    let s = raw.toUpperCase(), r = '', fixed = 0, dropped = 0;
    for(const ch of s){
      if(CODE_CHARS.includes(ch)) r += ch;
      else if(/\s/.test(ch)) continue;
      else if(fixOcr && OCR_FIX[ch]){r += OCR_FIX[ch]; fixed++}
      else dropped++;
    }
    return {r, fixed, dropped};
  }

  function decrypt(raw, fixOcr){
    const {r, fixed, dropped} = cleanCode(raw, fixOcr);
    let out = '', bad = 0;
    const full = Math.floor(r.length/TOKEN_LEN);
    for(let i=0;i<full;i++){
      const t = r.substr(i*TOKEN_LEN,TOKEN_LEN);
      if(Object.prototype.hasOwnProperty.call(DEC,t)) out += DEC[t];
      else {out += '�'; bad++}
    }
    const rest = r.length % TOKEN_LEN;
    return {text: out, bad, rest, fixed, dropped, tokens: full};
  }

  /* ================= UI ================= */
  const $ = id => document.getElementById(id);
  $('cnt').textContent = symbols.length;

  // Таблица алфавита
  const tbl = $('table');
  symbols.forEach(s=>{
    const d = document.createElement('div');
    const label = s===' ' ? '␣' : s==='\n' ? '↵' : s;
    d.innerHTML = '<b></b><span></span>';
    d.firstChild.textContent = label;
    d.lastChild.textContent = ENC[s];
    tbl.appendChild(d);
  });

  // Вкладки
  document.querySelectorAll('nav button').forEach(b=>{
    b.addEventListener('click',()=>{
      document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));
      document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      $(b.dataset.tab).classList.add('active');
      $('tab1').parentElement.scrollTop = 0;
    });
  });

  function setMsg(el, text, cls){el.textContent = text||''; el.className = 'msg'+(cls?' '+cls:'')}

  function reportDecode(res, el){
    const parts = [];
    if(res.bad) parts.push('неизвестных кодов: '+res.bad+' (�)');
    if(res.rest) parts.push('лишних символов в конце: '+res.rest);
    if(res.dropped) parts.push('отброшено посторонних: '+res.dropped);
    if(res.fixed) parts.push('исправлено OCR-ошибок: '+res.fixed);
    if(!res.tokens) setMsg(el,'Код пуст или не распознан','err');
    else if(parts.length) setMsg(el,'⚠ '+parts.join('; '),'');
    else setMsg(el,'OK: расшифровано '+res.tokens+' симв.','ok');
  }

  // Шифрование
  $('btnEnc').addEventListener('click',()=>{
    const v = $('plain').value;
    if(!v){setMsg($('encMsg'),'Введите текст','err');return}
    const {code, skipped} = encrypt(v);
    $('encOut').value = code;
    if(skipped.length) setMsg($('encMsg'),'⚠ пропущены неподдерживаемые символы: '+skipped.join(' '),'');
    else setMsg($('encMsg'),'OK: зашифровано','ok');
  });

  // Копирование
  $('btnCopy').addEventListener('click', async ()=>{
    const v = $('encOut').value;
    if(!v){setMsg($('encMsg'),'Нечего копировать','err');return}
    try{
      await navigator.clipboard.writeText(v);
    }catch(e){
      const ta = $('encOut'); ta.removeAttribute('readonly'); ta.focus(); ta.select();
      ta.setSelectionRange(0,ta.value.length);
      try{document.execCommand('copy')}catch(_){}
      ta.setAttribute('readonly',''); ta.blur();
    }
    setMsg($('encMsg'),'✓ скопировано в буфер','ok');
  });

  // Ручная расшифровка
  $('btnDec').addEventListener('click',()=>{
    const res = decrypt($('cipher').value,false);
    $('decOut').value = res.text;
    reportDecode(res,$('decMsg'));
  });

  /* ================= OCR ================= */
  const fileInput = $('fileInput');
  $('btnPhoto').addEventListener('click',()=>fileInput.click());

  function loadImage(file){
    return new Promise((res,rej)=>{
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = ()=>res({img,url});
      img.onerror = ()=>{URL.revokeObjectURL(url);rej(new Error('Не удалось открыть изображение'))};
      img.src = url;
    });
  }

  // Предобработка: масштаб, градации серого, растяжка контраста
  function preprocess(img){
    const maxW = 2000;
    const scale = Math.min(1, maxW/Math.max(img.naturalWidth,img.naturalHeight));
    const w = Math.round(img.naturalWidth*scale), h = Math.round(img.naturalHeight*scale);
    const c = document.createElement('canvas'); c.width=w; c.height=h;
    const ctx = c.getContext('2d',{willReadFrequently:true});
    ctx.drawImage(img,0,0,w,h);
    const d = ctx.getImageData(0,0,w,h), p = d.data;
    let min=255,max=0;
    for(let i=0;i<p.length;i+=4){
      const g = (p[i]*0.299+p[i+1]*0.587+p[i+2]*0.114)|0;
      p[i]=p[i+1]=p[i+2]=g; if(g<min)min=g; if(g>max)max=g;
    }
    const k = 255/Math.max(1,max-min);
    for(let i=0;i<p.length;i+=4){
      const v = Math.max(0,Math.min(255,((p[i]-min)*k)|0));
      p[i]=p[i+1]=p[i+2]=v;
    }
    ctx.putImageData(d,0,0);
    return new Promise(r=>c.toBlob(r,'image/png'));
  }

  let worker = null;
  async function getWorker(){
    if(worker) return worker;
    if(typeof Tesseract==='undefined') throw new Error('Tesseract.js не загружен (нужен интернет)');
    worker = await Tesseract.createWorker('eng',1,{
      logger: m=>{
        if(m.status==='recognizing text'){
          $('barI').style.width = Math.round(m.progress*100)+'%';
          setMsg($('ocrMsg'),'Распознавание: '+Math.round(m.progress*100)+'%','ok');
        } else if(m.status){
          setMsg($('ocrMsg'),'Загрузка модуля: '+m.status+'…','ok');
        }
      }
    });
    await worker.setParameters({
      tessedit_char_whitelist: CODE_CHARS+' ',
      preserve_interword_spaces:'1'
    });
    return worker;
  }

  fileInput.addEventListener('change', async ()=>{
    const file = fileInput.files && fileInput.files[0];
    if(!file) return;
    const btn = $('btnPhoto'); btn.disabled = true;
    $('bar').style.display='block'; $('barI').style.width='0';
    setMsg($('ocrMsg'),'Подготовка изображения…','ok');
    try{
      const {img,url} = await loadImage(file);
      $('prevImg').src = url; $('preview').style.display='block';
      const blob = await preprocess(img);
      const w = await getWorker();
      const {data} = await w.recognize(blob);
      const res = cleanCode(data.text||'',true);
      // форматируем тройками для удобства правки
      const groups = res.r.match(new RegExp('.{1,'+TOKEN_LEN+'}','g'))||[];
      $('ocrOut').value = groups.join(' ');
      if(!groups.length) setMsg($('ocrMsg'),'Код не найден. Попробуйте снять ближе и ярче.','err');
      else setMsg($('ocrMsg'),'✓ Готово. Проверьте код и нажмите «Расшифровать».','ok');
    }catch(e){
      setMsg($('ocrMsg'),'Ошибка: '+(e.message||e),'err');
    }finally{
      btn.disabled = false; fileInput.value='';
      setTimeout(()=>{$('bar').style.display='none'},600);
    }
  });

  $('btnOcrDec').addEventListener('click',()=>{
    const res = decrypt($('ocrOut').value,true);
    $('ocrText').value = res.text;
    reportDecode(res,$('ocrDecMsg'));
  });

  /* ============ Самотест (в консоли) ============ */
  try{
    const sample = symbols.join('');
    const r = decrypt(encrypt(sample).code,false).text;
    console.log('[cipher self-test]', r===sample ? 'OK' : 'FAIL');
  }catch(e){console.error(e)}
})();
</script>
</body>
</html>
